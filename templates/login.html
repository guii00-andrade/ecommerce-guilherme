<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | TechStore</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <h1>TechStore</h1>

    <nav>

        <a href="/">
            Início
        </a>

        <a href="/produtos">
            Produtos
        </a>

        <a href="/cadastro">
            Criar conta
        </a>

    </nav>

</header>


<main>

    <div class="formulario">

        <h2>
            Bem-vindo de volta
        </h2>

        {% if erro %}

            <p class="erro">
                {{ erro }}
            </p>

        {% endif %}


        <form method="POST">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="seu@email.com"
                required
            >


            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required
            >


            <button type="submit">
                Entrar
            </button>

        </form>


        <p>
            Ainda não possui uma conta?
            <a href="/cadastro">
                Criar conta
            </a>
        </p>

    </div>

</main>

</body>

</html>
